<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENVIO 3D World</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080711;color:#fff;font:14px Inter,system-ui,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}#hud{position:fixed;left:24px;top:22px;max-width:420px;padding:20px;border:1px solid #ffffff26;border-radius:16px;background:#0d0b18c9;backdrop-filter:blur(14px)}.eyebrow{font-size:10px;letter-spacing:2px;color:#c1aaff}h1{font-size:clamp(28px,5vw,48px);margin:10px 0}p{color:#c3bfd0;line-height:1.7}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#9d7aff24;color:#d6c7ff;font-size:11px}#status{position:fixed;bottom:18px;left:24px;color:#aaa5b7;font-size:12px}#error{max-width:600px;margin:20vh auto;padding:28px;background:#171423;border:1px solid #ffffff22;border-radius:14px} @media(max-width:600px){#hud{left:12px;right:12px;top:12px;padding:15px}}</style></head><body><div id="scene"></div><section id="hud"><div class="eyebrow">A WORLD POWERED BY ZENVIO</div><span class="tag" id="industry">INTERACTIVE 3D EXPERIENCE</span><h1 id="title">Loading world…</h1><p id="welcome">Preparing your experience.</p></section><div id="status">Drag to look around · Scroll to zoom</div><script>
const SUPABASE_URL="https://bohblrqrkkfmqwvtulcs.supabase.co";const SUPABASE_KEY="sb_publishable_kDAD7Eo3LDNKO7T18niELA_qGFdq8D9";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const slug=new URLSearchParams(location.search).get("slug");

eUrls.length,1))*Math.PI*2;panel.position.set(Math.cos(angle)*5,1.7,Math.sin(angle)*5-1);panel.lookAt(0,1.7,0);group.add(panel);},undefined,()=>{});});let down=false,lastX=0,lastY=0,rx=0,ry=0;renderer.domElement.addEventListener("pointerdown",e=>{down=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener("pointerup",()=>down=false);renderer.domElement.addEventListener("pointermove",e=>{if(!down)return;ry+=(e.clientX-lastX)*.004;rx+=(e.clientY-lastY)*.003;lastX=e.clientX;lastY=e.clientY;});renderer.domElement.addEventListener("wheel",e=>{camera.position.z=Math.max(4,Math.min(14,camera.position.z+e.deltaY*.008))},{passive:true});addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);if(!down)ry+=.0015;group.rotation.y=ry;group.rotation.x=Math.max(-.35,Math.min(.35,rx));ring.rotation.z+=.001;renderer.render(scene,camera)}animate();}
