<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENVIO ONE — Owner Invitation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 80% 0%,#583b9b35,transparent 40%),#090812;color:#f8f7ff;font:14px Inter,system-ui,sans-serif}.card{width:min(92vw,460px);padding:28px;background:#171525;border:1px solid #ffffff22;border-radius:14px}.eyebrow{font-size:10px;letter-spacing:2px;color:#c5b2ff}h1{font-size:30px}.muted{color:#a09caf;line-height:1.7}.field{display:grid;gap:7px;margin:14px 0}.field input{background:#0b0a13;color:white;border:1px solid #ffffff22;border-radius:8px;padding:12px}.btn{background:linear-gradient(110deg,#c4b5fd,#8b75ef);border:0;border-radius:8px;padding:12px 16px;font-weight:750;cursor:pointer;color:#100d1c}.error{color:#ff9caa;min-height:20px}.ok{color:#8ef0c2;line-height:1.6}</style></head><body><main class="card"><div class="eyebrow">ZENVIO ONE · PRIVATE OWNER INVITATION</div><h1>Create your owner account</h1><p class="muted">Use the email address that received this invitation. Create your own password. After accepting, you can sign in and create your private company workspace.</p><form id="form"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Create password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" id="submit">Create account & accept invitation</button></form><p id="status" class="error"></p><p id="message" class="ok"></p></main>
<script>
const SUPABASE_URL="https://bohblrqrkkfmqwvtulcs.supabase.co",SUPABASE_KEY="sb_publishable_kDAD7Eo3LDNKO7T18niELA_qGFdq8D9",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
const token=new URLSearchParams(location.search).get("token");
async function accept(){if(!token)throw Error("Invitation token is missing from this link.");const {data,error}=await db.rpc("zenvio_accept_owner_invite",{p_token:token});if(error)throw error;$("message").textContent="Invitation accepted. Your owner access is active. Next, open the ZENVIO ONE workspace and create your company workspace.";$("status").textContent="";const a=document.createElement("a");a.href="/one.html";a.textContent="Open ZENVIO ONE →";a.style="display:inline-block;margin-top:12px;color:#d8caff";$("message").appendChild(document.createElement("br"));$("message").appendChild(a);}
async function finishSignup(){const {data,error}=await db.auth.signUp({email:$("email").value.trim(),password:$("password").value,options:{emailRedirectTo:location.origin+"/owner-invite.html?token="+encodeURIComponent(token)}});if(error)throw error;if(data.session){await accept();}else{$("message").textContent="Account created. Check your email and confirm the address, then reopen this same invitation link and sign in to accept it.";}}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;$("status").textContent="";$("message").textContent="";try{const {data}=await db.auth.getSession();if(data.session){await accept();}else{await finishSignup();}}catch(x){$("status").textContent=x.message||String(x);}finally{$("submit").disabled=false;}});
db.auth.onAuthStateChange(async(event,s)=>{if(event==="SIGNED_IN"&&s&&token){try{await accept();}catch(x){$("status").textContent=x.message||String(x);}}});
db.auth.getSession().then(async({data})=>{if(data.session&&token){$("email").value=data.session.user.email||"";try{await accept();}catch(x){$("status").textContent=x.message||String(x);}}});
if(!token)$("status").textContent="Invalid invitation link.";
</script></main></body></html>
